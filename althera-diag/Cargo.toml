[package]
name = "althera-diag"
version = "0.1.0"
edition = "2021"
description = "Althera Diagnóstico Remoto - módulo de diagnóstico do Althera Remote"
publish = false

# crate independente (não faz parte do workspace do RustDesk)
[workspace]

[[bin]]
name = "AltheraDiag"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.32"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.4"
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
